# Este archivo va en: .github/workflows/escanear.yml (dentro del repo del backend)
#
# Corre subir_a_firebase.py automáticamente cada 4 horas (hora UTC) y
# también se puede lanzar a mano desde la pestaña "Actions" de GitHub
# con el botón "Run workflow" (gracias a workflow_dispatch).
#
# Con las 10 monedas escaneadas en grupos de 3 en paralelo, un run
# completo tarda entre 8 y 15 minutos aprox. (antes tardaba ~4 min con
# solo 2 monedas secuenciales). A 4 corridas al día, esto usa entre
# ~30 y ~60 minutos de los 2000 minutos/mes gratis de GitHub Actions.

name: Escanear ofertas y subir a Firebase

on:
  schedule:
    - cron: "0 */4 * * *"   # cada 4 horas — la hora es UTC, no la de Colombia
  workflow_dispatch: {}

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir la clave de servicio de Firebase (desde el secreto)
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}" | base64 -d > firebase-key.json

      - name: Escanear y subir a Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-key.json
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: python subir_a_firebase.py

      - name: Borrar la clave (no debe quedar en los logs ni en el runner)
        if: always()
        run: rm -f firebase-key.json
